  <text x="110" y="390" text-anchor="middle" font-size="13" font-weight="600" fill="#3730A3">C · Signal / Ping</text>
  <text x="110" y="406" text-anchor="middle" font-size="10" fill="#64748B">a response coming back to you</text>

  <!-- ============ D · Conversation ============ -->
  <svg x="250" y="250" width="120" height="120" viewBox="0 0 64 64">
