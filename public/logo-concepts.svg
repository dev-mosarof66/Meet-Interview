<svg width="420" height="470" viewBox="0 0 420 470" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="420" height="470" rx="16" fill="#F8FAFC"/>
