  <text x="110" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#3730A3">A · Monogram “C”</text>
  <text x="110" y="206" text-anchor="middle" font-size="10" fill="#64748B">bold &amp; iconic · scales tiny</text>

  <!-- ============ B · Reply ✓ ============ -->
  <svg x="250" y="50" width="120" height="120" viewBox="0 0 64 64">
