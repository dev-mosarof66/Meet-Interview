  </svg>
  <text x="310" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#3730A3">B · Reply + Check</text>
  <text x="310" y="206" text-anchor="middle" font-size="10" fill="#64748B">“answered” = the win moment</text>

  <!-- ============ C · Signal / Ping ============ -->
